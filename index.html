<style>
:root {
  --bg: #070a12;
  --panel: rgba(255, 255, 255, 0.06);
  --panel2: rgba(255, 255, 255, 0.09);
  --text: rgba(255, 255, 255, 0.92);
  --muted: rgba(255, 255, 255, 0.68);
  --brand: #8bd6ff;
  --brand2: #b892ff;
  --accent: #ffd28b;
  --danger: #ff6b6b;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  --radius: 22px;
  --radius2: 16px;
  --max: 1180px;
  --border: rgba(255, 255, 255, 0.10);
  --border2: rgba(255, 255, 255, 0.14);
  --blur: 18px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
    "Courier New", monospace;
  --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
    "Apple Color Emoji", "Segoe UI Emoji";
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  font-family: var(--sans);
  color: var(--text);
  background: radial-gradient(1100px 700px at 15% 10%, rgba(139, 214, 255, 0.20), transparent 55%),
    radial-gradient(900px 600px at 85% 20%, rgba(184, 146, 255, 0.18), transparent 55%),
    radial-gradient(1200px 800px at 50% 85%, rgba(255, 210, 139, 0.10), transparent 60%),
    linear-gradient(180deg, #050812, #060a14 40%, #04060e);
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

a:hover {
  text-decoration: none;
}

.container {
  width: min(var(--max), calc(100% - 48px));
  margin: 0 auto;
}

/* Top nav */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  background: rgba(7, 10, 18, 0.55);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  letter-spacing: 0.2px;
}

.sigil {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(139, 214, 255, 0.95), rgba(184, 146, 255, 0.95));
  box-shadow: 0 10px 25px rgba(139, 214, 255, 0.20);
  position: relative;
  overflow: hidden;
}

.sigil:before {
  content: "";
  position: absolute;
  inset: -40% -40% auto auto;
  width: 100px;
  height: 100px;
  background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), transparent 60%);
  transform: rotate(25deg);
  opacity: 0.5;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.nav-links a {
  padding: 10px 12px;
  border-radius: 12px;
  color: var(--muted);
  border: 1px solid transparent;
  transition: all 180ms ease;
  font-size: 14px;
}

.nav-links a:hover {
  color: var(--text);
  border-color: rgba(255, 255, 255, 0.10);
  background: rgba(255, 255, 255, 0.04);
}

.cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 14px;
  border-radius: 14px;
  font-weight: 650;
  letter-spacing: 0.2px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: linear-gradient(135deg, rgba(139, 214, 255, 0.16), rgba(184, 146, 255, 0.14));
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
  transition: transform 160ms ease, border-color 160ms ease;
  font-size: 14px;
  white-space: nowrap;
}

.cta:hover {
  transform: translateY(-1px);
  border-color: rgba(255, 255, 255, 0.24);
}

/* Shop Dropdown */
.shop-dropdown {
  position: relative;
  display: inline-block;
}

.shop-toggle {
  cursor: pointer;
}

.shop-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 180px;
  display: none;
  flex-direction: column;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(7,10,18,0.95);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: var(--shadow);
  overflow: hidden;
  z-index: 999;
}

.shop-menu.show {
  display: flex;
}

.shop-menu a {
  padding: 12px 16px;
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.shop-menu a:last-child {
  border-bottom: none;
}

.shop-menu a:hover {
  background: rgba(255,255,255,0.06);
}


/* =========================
   Collapsible Mobile Nav
   (desktop stays the same)
   ========================= */
.nav-toggle {
  display: none; /* enabled only on mobile */
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.04);
  color: var(--text);
  cursor: pointer;
  font-weight: 650;
  font-size: 14px;
}

.nav-toggle:hover {
  border-color: rgba(255,255,255,0.22);
  background: rgba(255,255,255,0.06);
}

.nav-toggle-icon {
  width: 18px;
  height: 12px;
  display: inline-block;
  position: relative;
}

.nav-toggle-icon::before,
.nav-toggle-icon::after,
.nav-toggle-icon span {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 2px;
  border-radius: 2px;
  background: rgba(255,255,255,0.86);
}

.nav-toggle-icon::before { top: 0; }
.nav-toggle-icon::after { bottom: 0; }
.nav-toggle-icon span { top: 5px; }

.nav-menu {
  display: flex; /* desktop shows normally */
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

/* Hero */
.hero {
  padding: 70px 0 36px;
  position: relative;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.35fr 0.9fr;
  gap: 24px;
  align-items: center;
}

.kicker {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.05);
  color: var(--muted);
  font-size: 13px;
}

.dot {
  width: 8px;
  height: 8px;
